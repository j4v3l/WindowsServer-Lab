name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.0)'
        required: true
        type: string

jobs:
  create-release:
    name: Create Release
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Validate Version
      shell: pwsh
      run: |
        $version = "${{ github.event.inputs.version }}"
        if (-not $version) {
            $version = "${{ github.ref_name }}" -replace '^v', ''
        }
        
        Write-Host "Release version: $version"
        
        # Validate version format (semantic versioning)
        if ($version -match '^\d+\.\d+\.\d+$') {
            Write-Host "Valid version format" -ForegroundColor Green
        } else {
            Write-Host "Invalid version format. Expected: x.y.z" -ForegroundColor Red
            exit 1
        }
        
        echo "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

    - name: Update VERSION File
      shell: pwsh
      run: |
        $version = $env:RELEASE_VERSION
        $version | Out-File -FilePath "VERSION" -Encoding UTF8 -NoNewline
        Write-Host "Updated VERSION file to $version"

    - name: Update PowerShell Module Version
      shell: pwsh
      run: |
        $manifestPath = "Scripts/WindowsServerLab.psd1"
        $version = "${{ github.ref_name }}"
        
        # Remove 'v' prefix if present
        if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
        }
        
        # Note: PowerShell module files were removed during Proxmox adaptation
        Write-Host "PowerShell module files were removed - using VERSION file instead" -ForegroundColor Yellow
        
        if (Test-Path "VERSION") {
            $version = Get-Content "VERSION" -Raw
            $version = $version.Trim()
        }
        
        if (Test-Path $manifestPath) {
            $content = Get-Content $manifestPath -Raw
            $content = $content -replace "ModuleVersion\s*=\s*'[^']*'", "ModuleVersion = '$version'"
            $content | Out-File -FilePath $manifestPath -Encoding UTF8
            Write-Host "Updated PowerShell module version to $version"
        }

    - name: Generate Release Notes
      shell: pwsh
      run: |
        $version = $env:RELEASE_VERSION
        
        # Create release notes
        $notes = @"
        # 🚀 Windows Server Lab Environment v$version

        ## ✨ What's New in This Release

        "@ 
        
        # Add version-specific notes
        if ($version.StartsWith("1.1")) {
            $notes += "`n- 🏰 **Organized Demo Environment**: Complete Asgard Technologies demo moved to dedicated Demo/ directory"
            $notes += "`n- 📚 **Enhanced Documentation**: Comprehensive demo guides and technical documentation"
            $notes += "`n- 🎭 **Norse Mythology Theme**: Professional enterprise demo with 25 VMs and realistic organizational structure"
            $notes += "`n- 🔧 **Automated Deployment**: Enhanced deployment scripts with error handling and validation"
            $notes += "`n- 📊 **Clean Project Structure**: Better organization with separation of core tools and demo materials"
        } else {
            $notes += "`n- Complete Proxmox VE lab environment setup"
            $notes += "`n- Active Directory automation and management"
            $notes += "`n- Security auditing and hardening tools"
            $notes += "`n- Group Policy management automation"
            $notes += "`n- System monitoring and health checks"
        }
        
        $notes += "`n`n## 🚀 Quick Start"
        $notes += "`n1. Download and extract the release"
        $notes += "`n2. Follow the Proxmox setup documentation"
        $notes += "`n3. Create VMs manually using Proxmox VE web interface"
        if ($version.StartsWith("1.1")) {
            $notes += "`n4. Or deploy the organized demo from the Demo/ directory"
        } else {
            $notes += "`n4. Or deploy the Asgard demo"
        }
        
        $notes += "`n`nFull changelog available in CHANGELOG.md"
        
        $notes | Out-File -FilePath "RELEASE_NOTES.md" -Encoding UTF8
        Write-Host "Generated release notes"

    - name: Create Release Archive
      shell: pwsh
      run: |
        $version = $env:RELEASE_VERSION
        $archiveName = "WindowsServerLab-Proxmox-v$version.zip"
        
        # Create release directory
        $releaseDir = "WindowsServerLab-Proxmox-v$version"
        New-Item -Path $releaseDir -ItemType Directory -Force
        
        # Copy core files
        $filesToInclude = @(
            'Scripts/',
            'LabSetupTutorials/',
            'Demo/',
            'README.md',
            'CHANGELOG.md',
            'LICENSE',
            'CONTRIBUTING.md',
            'VERSION'
        )
        
        foreach ($item in $filesToInclude) {
            if (Test-Path $item) {
                if (Test-Path $item -PathType Container) {
                    Copy-Item -Path $item -Destination $releaseDir -Recurse -Force
                } else {
                    Copy-Item -Path $item -Destination $releaseDir -Force
                }
                Write-Host "Included: $item"
            }
        }
        
        # Create ZIP archive
        Compress-Archive -Path $releaseDir -DestinationPath $archiveName -Force
        Write-Host "Created release archive: $archiveName"
        
        echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ env.RELEASE_VERSION }}
        release_name: Windows Server Lab Environment v${{ env.RELEASE_VERSION }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.ARCHIVE_NAME }}
        asset_name: ${{ env.ARCHIVE_NAME }}
        asset_content_type: application/zip 