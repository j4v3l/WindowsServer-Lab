name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Validate and publish archive
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate tag and module versions
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}' -replace '^v', ''
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Tag is not semantic versioning: $tagVersion" }
          $fileVersion = (Get-Content VERSION -Raw).Trim()
          $module = Test-ModuleManifest Scripts/WindowsServerLab/WindowsServerLab.psd1
          if ($fileVersion -ne $tagVersion) { throw "VERSION contains $fileVersion but tag is $tagVersion" }
          if ($module.Version.ToString() -ne $tagVersion) { throw "Module contains $($module.Version) but tag is $tagVersion" }
      - name: Run release smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck
          Tests/Shell/test-config.sh
          Tests/Shell/test-template-certification.sh
          shellcheck Tools/*.sh Tools/Proxmox/*.sh Tools/Proxmox/lib/*.sh Tests/Shell/*.sh
      - name: Build deterministic release archive
        run: |
          release_name="WindowsServerLab-v$(cat VERSION)"
          mkdir "$release_name"
          cp -R LabConfig Scripts Tools packer Tests Demo LabSetupTutorials docs .github "$release_name/"
          cp README.md CHANGELOG.md CONTRIBUTING.md LICENSE VERSION PSScriptAnalyzerSettings.psd1 "$release_name/"
          find "$release_name" -exec touch -h -t 198001010000 {} +
          zip -X -q -r "${release_name}.zip" "$release_name"
          unzip -q -t "${release_name}.zip"
          mkdir /tmp/windowsserverlab-release-smoke
          unzip -q "${release_name}.zip" -d /tmp/windowsserverlab-release-smoke
          (cd "/tmp/windowsserverlab-release-smoke/$release_name" && Tests/Shell/test-config.sh && Tests/Shell/test-template-certification.sh)
          sha256sum "${release_name}.zip" > "${release_name}.zip.sha256"
          printf 'RELEASE_ARCHIVE=%s\n' "${release_name}.zip" >> "$GITHUB_ENV"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: windowsserverlab.spdx.json
          upload-artifact: false
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" windowsserverlab.spdx.json \
            --title "Windows Server Lab ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
