name: Documentation

on:
  push:
    paths:
      - '**/*.md'
      - '.github/markdown-link-check-config.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/markdown-link-check-config.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned link checker
        run: npm install --global markdown-link-check@3.13.7
      - name: Validate all Markdown links
        run: |
          status=0
          while IFS= read -r -d '' file; do
            markdown-link-check --quiet --config .github/markdown-link-check-config.json "$file" || status=1
          done < <(find . -name '*.md' -not -path './.git/*' -print0)
          exit "$status"
      - name: Validate required documentation
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -f docs/EXECUTION_CONTEXT.md
          test -f docs/LIVE_CERTIFICATION.md
          test -f docs/BACKUP_RECOVERY.md
