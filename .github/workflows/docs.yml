name: Documentation

on:
  push:
    branches: [ main, dev ]
    paths:
      - '**.md'
      - 'LabSetupTutorials/**'
      - 'Demo/Documentation/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - '**.md'
      - 'LabSetupTutorials/**'
      - 'Demo/Documentation/**'

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install markdown-link-check
      run: npm install -g markdown-link-check
      
    - name: Validate Markdown Links
      run: |
        echo "Checking markdown files for broken links..."
        find . -name "*.md" -not -path "./.git/*" | xargs markdown-link-check --config .github/markdown-link-check-config.json
      continue-on-error: true
      
    - name: Check Documentation Structure
      run: |
        echo "Checking documentation structure..."
        
        # Check for required files
        required_files=(
          "README.md"
          "CHANGELOG.md"
          "LICENSE"
          "CONTRIBUTING.md"
        )
        
        missing_files=()
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            missing_files+=("$file")
          fi
        done
        
        if [ ${#missing_files[@]} -gt 0 ]; then
          echo "Missing required files:"
          printf '%s\n' "${missing_files[@]}"
          exit 1
        else
          echo "All required documentation files found!"
        fi
        
        # Count tutorial files
        tutorial_count=$(find LabSetupTutorials -name "*.md" | wc -l)
        echo "Found $tutorial_count tutorial files"
        
        # Count demo documentation
        demo_docs=$(find Demo -name "*.md" | wc -l)
        echo "Found $demo_docs demo documentation files"

  generate-toc:
    name: Generate Table of Contents
    runs-on: ubuntu-latest
    needs: validate-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install doctoc
      run: npm install -g doctoc
      
    - name: Generate TOCs
      run: |
        echo "Generating table of contents for documentation..."
        
        # Generate TOC for main README
        doctoc README.md --title "## Table of Contents"
        
        # Generate TOCs for tutorial files
        find LabSetupTutorials -name "*.md" -exec doctoc {} --title "## Table of Contents" \;
        
        # Generate TOCs for demo documentation
        find Demo -name "*.md" -exec doctoc {} --title "## Table of Contents" \;
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if git diff --quiet; then
          echo "No changes to commit"
        else
          git add -A
          git commit -m "Auto-update documentation TOCs [skip ci]"
          git push
        fi 