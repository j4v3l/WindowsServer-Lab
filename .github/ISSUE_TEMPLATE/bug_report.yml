name: Bug Report
description: Report a bug or issue with the Windows Server Lab Environment
title: "[BUG] "
labels: ["bug", "triage"]
projects: ["j4v3l/1"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide detailed information to help us reproduce and fix the issue.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: What environment are you running in?
      placeholder: Windows Server 2022, Windows 11, Proxmox VE, etc.
    validations:
      required: true

  - type: input
    id: powershell-version
    attributes:
      label: PowerShell Version
      description: Which PowerShell version are you using?
      placeholder: PowerShell 7.4.0, Windows PowerShell 5.1, etc.
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen
      placeholder: Tell us what you see! Include error messages if any.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Tell us how to reproduce this bug
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Please copy and paste any relevant log output or error messages
      render: shell
    validations:
      required: false

  - type: dropdown
    id: affected-component
    attributes:
      label: Affected Component
      description: Which component is affected by this bug?
      options:
        - Core Lab Environment
        - Active Directory
        - DNS Configuration
        - DHCP Configuration
        - Group Policy
        - Security Tools
        - Proxmox VE Management
        - Manual Setup Procedures
        - Backup/Restore
        - System Monitoring
        - Documentation
        - Demo Environment (Asgard Technologies)
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true 